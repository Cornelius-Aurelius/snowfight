<body>
<main aria-label="Snowfight" id="arena">
  <canvas id="game" aria-label="Snowy battlefield. Move the snowman with a drag, the arrow keys, or A and D. Shots fire automatically."></canvas>
  <header>
    <div class="hud"><div class="brand">SNOWFIGHT</div><div id="health" aria-label="5 snowballs remaining"></div></div>
    <div class="wave"><span id="chapter">LEVEL 1 / 40</span><span id="wave">WAVE 1 / 5</span><small id="score">0 pts</small></div>
    <button id="pause" aria-label="Pause game" disabled>Ⅱ</button>
  </header>
  <div id="toast" aria-live="polite"></div>
  <div id="streak" hidden></div>
  <div id="rush" hidden>❄ FROST RUSH <span id="rush-time"></span></div>
  <div id="hint">Drag to slide · Aim by moving</div>
  <section id="panel" aria-label="Game menu">
    <div id="main-card" class="card">
      <p id="location" class="location">Toy Factory · Level 1</p>
      <h1 id="title">Snowfight</h1>
      <p id="details">Slide, fling chocolate buttons, and stop the toy army.</p>
      <button id="action">Play</button>
      <button id="again" hidden>Restart level</button>
      <button id="levels">Levels</button>
      <div id="medal" hidden></div>
      <div id="best"></div>
      <a class="credit" href="https://corneliusaurelius.com/" target="_blank" rel="noopener">By Cornelius Aurelius</a>
    </div>
    <div id="level-picker" class="card picker" hidden>
      <div class="picker-header">
        <h2>Choose a level</h2>
        <button id="close-levels">Back</button>
      </div>
      <div id="level-grid"></div>
    </div>
  </section>
  <footer><button id="mute" aria-label="Mute sound" title="Sound" aria-pressed="false">♫</button>
    <button id="share" aria-label="Share Snowfight" title="Share">↗</button>
  </footer>
</main>
<script src="game.js?v=2" defer></script>
</body>
</html>
